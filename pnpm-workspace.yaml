packages:
  - 'packages/*'
  - 'apps/*'
# esbuild ships a precompiled binary through its install script; Vite does not
# work without it. Every other script stays blocked.
allowBuilds:
  esbuild: true
  # The script fetches the wasm core into its own `dist`. Without it OCR has nothing to load.
  tesseract.js: true
