packages:
  - 'packages/*'
  - 'apps/*'
# esbuild ships a precompiled binary through its install script; Vite does not
# work without it. Every other script stays blocked.
allowBuilds:
  esbuild: true
  # Not run: its script is `opencollective-postinstall`, a request for donations,
  # and fetches nothing. The OCR core comes from `tesseract.js-core` through
  # tools/ocr-assets.mjs. Said here as false so the install is not left asking.
  tesseract.js: false
