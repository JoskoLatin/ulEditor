# ulEditor, the browser build, on the server at /opt/stacks/uleditor.
#
# A static site and nothing else: no ports of its own (the shared Caddy
# reaches it over `caddy-uleditor`), read-only everywhere, one capability, bounded in
# processes and memory, and the same Caddy the server already runs, pinned to
# its digest. `site/` is the built `packages/shell-ui/dist`, put there by
# tools/deploy-web.ps1.
services:
  uleditor:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: uleditor
    restart: unless-stopped
    read_only: true
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
    tmpfs:
      - /data:size=16m
      - /config:size=16m
    # Only the shared Caddy is on this network, and it is internal: no route
    # out, and over the network none of the other containers on `proxy` can
    # reach this one or be reached from it. It does not stand against a
    # container holding the docker socket (dockge): that one is root on the
    # host and can exec into this or connect it anywhere.
    # Created once, outside both stacks, so the shared Caddy never depends
    # on this stack being up; tools/deploy-web.ps1 refuses to deploy without it.
    networks:
      - caddy-uleditor
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The one capability back, and only because the image's caddy binary
    # carries it as a file capability: under no-new-privileges a binary that
    # asks for one it cannot have is refused at exec ("operation not
    # permitted"). The shared Caddy on this server is set the same way.
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 64
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  caddy-uleditor:
    external: true
