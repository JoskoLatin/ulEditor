[package]
name = "ul-core"
description = "ulEditor core: the virtual file system, search across it, and the library."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Not published: an application crate whose dependencies are declared by path.
# cargo-deny only honours `allow-wildcard-paths` for crates that say so.
publish = false

[dependencies]
ul-formats = { path = "../ul-formats" }
serde = { workspace = true }
thiserror = { workspace = true }
