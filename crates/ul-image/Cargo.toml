[package]
name = "ul-image"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Image transforms — the ones the viewer offers, done once and in one place."

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }

# Only the formats the viewer opens, and deliberately not AVIF: encoding it
# means rav1e, which is a video encoder and minutes of build time, and decoding
# it in `image` wants a C library. An `.avif` therefore stays viewable and is
# refused for editing, which is said in words rather than discovered.
[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "webp"]
