[package]
name = "uleditor-desktop"
description = "ulEditor — desktop shell"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "uleditor_lib"
# staticlib and cdylib are required for mobile targets (phase 4); desktop uses rlib.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ul-core = { path = "../../../crates/ul-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["sync"] }

# Windows and Linux start a second copy of the program for every file
# double-clicked. macOS does not: it hands the file to the running application
# itself, and the plugin's own documentation says not to use it there.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[features]
# Ships the webview inspector in a release build. Off by default: "Inspect" in
# the right-click menu of a document editor is a strange thing to hand somebody
# who opened a PDF. Debug builds always have it.
devtools = ["tauri/devtools"]
