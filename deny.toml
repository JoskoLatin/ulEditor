# Provjera licenci Rust ovisnosti.
#
# Core je Apache-2.0. Copyleft ovisnost koja se ušulja ovamo promijenila bi
# licencu cijelog projekta — zato je CI korak blokirajući, a ne informativan.
# Copyleft engine-i (MuPDF, ONLYOFFICE) smiju postojati samo kao zasebni
# opcionalni paketi u `plugins/`, izvan ovog workspacea.

[graph]
targets = [
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-apple-darwin" },
  { triple = "wasm32-unknown-unknown" },
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",       # LibreOffice i Collabora — copyleft po datoteci, ne po projektu
  "Unicode-3.0",
  "CC0-1.0",
  "Unlicense",
  "BSL-1.0",
  "OpenSSL",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Ove licence su namjerno izostavljene iz `allow` popisa: GPL-2.0, GPL-3.0,
# AGPL-3.0, LGPL-3.0, SSPL. Ako cargo-deny prijavi neku od njih, to nije
# greška u konfiguraciji nego stvarna promjena u stablu ovisnosti.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
