# Licence check for Rust dependencies.
#
# The core is Apache-2.0. A copyleft dependency sneaking in here would change the
# licence of the whole project — which is why this CI step blocks rather than
# informs. Copyleft engines (MuPDF, ONLYOFFICE) may exist only as separate
# optional packages under `plugins/`, outside this workspace.

[graph]
targets = [
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-apple-darwin" },
  { triple = "aarch64-linux-android" },
  { triple = "armv7-linux-androideabi" },
  { triple = "wasm32-unknown-unknown" },
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",       # LibreOffice and Collabora — copyleft per file, not per project
  "Unicode-3.0",
  "CC0-1.0",
  "Unlicense",
  "BSL-1.0",
  "OpenSSL",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Dependencies inside the workspace are declared by `path`, without a version,
# so cargo-deny otherwise counts them as wildcards. The ban targets external
# crates.
allow-wildcard-paths = true

# These licences are deliberately absent from the `allow` list: GPL-2.0,
# GPL-3.0, AGPL-3.0, LGPL-3.0, SSPL. If cargo-deny reports one of them, that is
# not a configuration mistake but a real change in the dependency tree.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
