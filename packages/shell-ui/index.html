<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` is what allows `env(safe-area-inset-*)` to hold a
         non-zero value at all; without it the webview stays inside the system
         bars and the insets are a dead letter. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>ulEditor</title>
  </head>

    <script type="module" src="/src/main.tsx"></script>
