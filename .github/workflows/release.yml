name: Release

# Installers are built in CI, not on a development machine.
#
# The reason is concrete: Windows Smart App Control blocks the unsigned
# build-script binaries cargo generates in the release profile, so `tauri build`
# on a machine with SAC in enforcement mode fails with "An Application Control
# policy has blocked this file (os error 4551)". GitHub runners have no SAC, and
# we get all three platforms at once as a bonus.
#
# One tag gives one release with everything inside — desktop installers and the
# phone APK. That is why `create-release` opens the draft once, by itself: were
# a builder to open it, five parallel jobs would race to create it and we would
# end up with five half-filled releases.
#
# **Building, signing and publishing are three jobs that do not share a key.**
# A build runs other people's code — every npm package's build step, every
# cargo build script and proc-macro. When the update key and a token that may
# write to the release were in that same step, any one of them could sign and
# publish an update every installed copy would accept. So:
#
# - the builders have no secret at all and may only read the repository; they
#   restore no cache, so nothing a CI run left behind is in the build;
# - the signers get only a key, and build nothing: the installers come in as
#   files, are signed, and every signature is checked against the key the
#   application carries before anything goes on;
# - the publishers get only the right to write to the release, and no key.
#
# The signers run in the `release` environment, which is where the keys belong
# and where GitHub can make a run wait for a person to approve it — see
# docs/RELEASE.md, "Who may sign".
#
# Started by hand with no tag, the whole thing is a trial run: this branch is
# built and signed with keys made for the run and thrown away with it, and
# nothing is published. That is how a change to this file is tried without a
# release.

on:
  push:
    tags: ['v*']
  # A single builder can fail on something the code has nothing to do with — a
  # broken NDK download, a runner that loses the network. Rebuilding all five
  # for it costs half an hour and republishes installers that were already
  # correct, so one platform can be built into the release that already exists.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build into its release, and it must already exist (v0.1.0). Empty: a trial run of this branch that publishes nothing'
        required: false
        default: ''
      platforms:
        description: 'Which builders to run'
        required: true
        default: all
        type: choice
        options: [all, desktop, android]

# Nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  plan:
    name: What this run is
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Tag, source and whether anything is published
        id: plan
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="$INPUT_TAG"
          fi
          if [[ -z "$tag" ]]; then
            echo "::notice::No tag: a trial run of $GITHUB_REF ($GITHUB_SHA). It is built and signed with keys made for this run, and nothing is published."
            { echo "tag="; echo "ref=$GITHUB_SHA"; echo "publish=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Checked here rather than left to the builders: a typo in the input
          # would otherwise surface twenty minutes later, as a checkout failure
          # in four jobs at once.
          if ! git ls-remote --exit-code --tags "$REPOSITORY" "refs/tags/$tag" >/dev/null; then
            echo "::error::There is no tag $tag in this repository."
            exit 1
          fi
          { echo "tag=$tag"; echo "ref=$tag"; echo "publish=true"; } >> "$GITHUB_OUTPUT"
        shell: bash

  create-release:
    name: Open the release draft
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Draft
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        # Through the environment rather than written into the script: an
        # expression in the script is pasted into the code before it runs.
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        with:
          result-encoding: string
          script: |
            const tag = process.env.TAG;
            const { owner, repo } = context.repo;
            // Looked for before it is created, because a release for this tag
            // may already be open — a rebuild of one platform is the ordinary
            // case. `getReleaseByTag` is no use here: it returns published
            // releases only, and ours stays a draft until the installers are
            // in it, so the list is searched instead.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100,
            });
            const existing = releases.find((r) => r.tag_name === tag);
            if (existing) {
              core.info(`Attaching to the release already open for ${tag} (${existing.id})`);
              return String(existing.id);
            }
            const { data } = await github.rest.repos.createRelease({
              owner, repo,
              tag_name: tag,
              name: `ulEditor ${tag}`,
              draft: true,
              generate_release_notes: true,
            });
            return String(data.id);

  # ── desktop ────────────────────────────────────────────────────────────

  desktop-build:
    name: Build ${{ matrix.label }}
    needs: plan
    if: inputs.platforms != 'android'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (MSI + NSIS)
            slug: windows
            args: ''
            bundle: target/release/bundle
          - os: macos-latest
            label: macOS (Apple Silicon)
            slug: macos-aarch64
            args: '--target aarch64-apple-darwin'
            bundle: target/aarch64-apple-darwin/release/bundle
            arch: aarch64
          - os: macos-latest
            label: macOS (Intel)
            slug: macos-x64
            args: '--target x86_64-apple-darwin'
            bundle: target/x86_64-apple-darwin/release/bundle
            arch: x64
          - os: ubuntu-24.04
            label: Linux (deb + AppImage)
            slug: linux
            args: ''
            bundle: target/release/bundle

    steps:
      # The tag, not the branch the run was started from: a rebuild has to
      # produce the same binary as the release it is joining. On a tag push
      # these are the same commit anyway.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false

      - name: System dependencies (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            librsvg2-dev patchelf libxdo-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev

      # No rust-cache and no pnpm cache here: a cache is written by other runs,
      # and what is in it would be in the installers.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile

      # `tauri build` makes the macOS updater bundle (`.app.tar.gz`) only when
      # it is asked for updater artifacts, and it refuses to make those unless
      # it can sign them. So it is given a key made here and now, which signs
      # nothing anybody will see: those signatures are left behind with the
      # runner, and the release's own are made by the signing job. The public
      # key compiled into the application is the one in tauri.conf.json, not
      # this one.
      - name: A key for this build only
        run: |
          pnpm --filter @uleditor/desktop exec tauri signer generate --ci -p "" -w "$RUNNER_TEMP/build-only.key"
          echo "TAURI_SIGNING_PRIVATE_KEY=$(cat "$RUNNER_TEMP/build-only.key")" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> "$GITHUB_ENV"
          node -e "const f='apps/desktop/src-tauri/tauri.conf.json';const fs=require('fs');const c=JSON.parse(fs.readFileSync(f,'utf8'));c.bundle.createUpdaterArtifacts=true;fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')"
        shell: bash

      - name: Build
        run: pnpm --filter @uleditor/desktop exec tauri build ${{ matrix.args }}
        shell: bash

      # The installers under the names the release has always had. Tauri names
      # each macOS updater bundle `ulEditor.app.tar.gz` whichever processor it
      # is for, so the architecture goes into the name — the manifest finds the
      # two by it (tools/updater-manifest.mjs).
      - name: Collect
        env:
          BUNDLE: ${{ matrix.bundle }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          for kind in msi nsis deb rpm appimage dmg; do
            for f in "$BUNDLE/$kind"/*; do
              case "$f" in
                *.msi|*-setup.exe|*.deb|*.rpm|*.AppImage|*.dmg) cp "$f" dist/ ;;
              esac
            done
          done
          for f in "$BUNDLE"/macos/*.app.tar.gz; do
            [ -f "$f" ] && cp "$f" "dist/$(basename "$f" .app.tar.gz)_${ARCH}.app.tar.gz"
          done
          ls -l dist
          if [ -z "$(ls dist)" ]; then
            echo "::error::Nothing was built into $BUNDLE."
            exit 1
          fi
        shell: bash

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-desktop-${{ matrix.slug }}
          path: dist/
          if-no-files-found: error
          # A week, not a day: the signers wait for a person to approve them
          # in the `release` environment, and on 2026-10-09 an approval given
          # two and a half days after the build found every build gone.
          retention-days: 7

  desktop-sign:
    name: Sign the desktop updates
    needs: [plan, desktop-build]
    runs-on: ubuntu-24.04
    environment: ${{ needs.plan.outputs.publish == 'true' && 'release' || 'trial' }}
    permissions:
      contents: read
    env:
      PUBLISH: ${{ needs.plan.outputs.publish }}
      # A secret cannot be read in an `if:` directly, so its presence becomes a
      # string here and the steps below branch on that.
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      # For the signer and the check that follows it — nothing here is built
      # or run from this checkout but those two.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @uleditor/desktop

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-desktop-*
          path: dist
          merge-multiple: true

      - name: Sign, and check every signature
        if: env.PUBLISH == 'true' && env.HAS_SIGNING_KEY == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node tools/sign-updates.mjs dist
        shell: bash

      # The same steps with a key made for the run, checked against that key:
      # what a trial proves is that signing and its check work, not the key.
      - name: Sign a trial run with a key made for it
        if: env.PUBLISH != 'true'
        run: |
          pnpm --filter @uleditor/desktop exec tauri signer generate --ci -p "" -w "$RUNNER_TEMP/trial.key"
          TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/trial.key")" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="" \
            node tools/sign-updates.mjs dist --pubkey "$(cat "$RUNNER_TEMP/trial.key.pub")"
        shell: bash

      # Without the secret a release still happens: the installers go on, and
      # only the update is missing — the program on somebody's machine simply
      # never offers this version. The macOS updater bundles are left off, as
      # they always were without a key: unsigned, nothing can use them.
      - name: Say why nothing was signed
        if: env.PUBLISH == 'true' && env.HAS_SIGNING_KEY != 'true'
        run: |
          # Installers and nothing else, as the signing step checks too: a
          # builder's own latest.json or .sig must not reach the release.
          node tools/sign-updates.mjs dist --unsigned
          rm -f dist/*.app.tar.gz
          echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set, so nothing was signed and no latest.json will be written. The installers in this release are complete; they simply will not be offered as an update. See docs/RELEASE.md."
        shell: bash

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-signed
          path: dist/
          if-no-files-found: error
          # A week, not a day: the signers wait for a person to approve them
          # in the `release` environment, and on 2026-10-09 an approval given
          # two and a half days after the build found every build gone.
          retention-days: 7
          # A signing job run again replaces what it made the first time.
          overwrite: true

  desktop-publish:
    name: Publish the desktop installers
    needs: [plan, create-release, desktop-sign]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-signed
          path: dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
        shell: bash

      # One manifest, written out of what is actually attached to the release.
      # Four builders each writing their own would leave whichever finished last
      # on the page, and the other three platforms would stop seeing updates
      # with no error anywhere — see the comment in the script.
      - name: latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          if ls dist/*.sig >/dev/null 2>&1; then
            node tools/updater-manifest.mjs "$TAG"
          else
            echo "Nothing was signed, so there is no manifest to write."
          fi
        shell: bash

  # ── Android ────────────────────────────────────────────────────────────

  android-build:
    name: Build Android (APK + AAB)
    needs: plan
    if: inputs.platforms != 'desktop'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Android NDK
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r27c
          # Not cached. The cache round-trip restores the NDK incomplete — the
          # per-API wrapper scripts survive but `bin/clang` itself does not, so
          # the linker fails with exit 127 and a "No such file or directory"
          # buried four lines into a shell script. Re-downloading costs a
          # minute; debugging that costs an afternoon.
          local-cache: false

      # Two architectures cover practically every Android device in the wild.
      # i686 and x86_64 exist only on emulators, and each extra one doubles the
      # duration of the Rust build.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile

      # No keystore here: without `keystore.properties` gradle builds the
      # release unsigned (build.gradle.kts), and the signing job signs it.
      - name: Build APK and AAB
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: pnpm --filter @uleditor/desktop exec tauri android build --apk --aab --target aarch64 armv7

      - name: Collect
        run: |
          out=apps/desktop/src-tauri/gen/android/app/build/outputs
          mkdir -p dist-android
          apk=$(find "$out/apk" -name '*-release-unsigned.apk' -o -name '*-release.apk' 2>/dev/null | head -1)
          aab=$(find "$out/bundle" -name '*-release.aab' 2>/dev/null | head -1)
          if [ -z "$apk" ]; then
            echo "::error::No APK was produced — check the output of the step above."
            exit 1
          fi
          cp "$apk" dist-android/unsigned.apk
          if [ -n "$aab" ]; then
            cp "$aab" dist-android/unsigned.aab
          fi
          ls -l dist-android
        shell: bash

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-android
          path: dist-android/
          if-no-files-found: error
          # A week, not a day: the signers wait for a person to approve them
          # in the `release` environment, and on 2026-10-09 an approval given
          # two and a half days after the build found every build gone.
          retention-days: 7

  android-sign:
    name: Sign Android
    needs: [plan, android-build]
    runs-on: ubuntu-24.04
    environment: ${{ needs.plan.outputs.publish == 'true' && 'release' || 'trial' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
          sparse-checkout: apps/desktop/src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-android
          path: dist-android

      # The key never touches the repository. It is written out of Secrets onto
      # the runner's disk, used, and removed — in a job that builds nothing.
      # A trial run makes a key of its own instead. The passwords go to the
      # tools through the environment, not on their command lines.
      # The secrets only when publishing: a trial run never has them in its
      # environment, whatever the step does. And the certificate a release is
      # signed with is checked against the one every installed copy has — a
      # keystore that is not it signs an APK no phone accepts as an update, and
      # says nothing. It is public: it is in every APK on the release page.
      - name: Sign and check
        env:
          PUBLISH: ${{ needs.plan.outputs.publish }}
          KEYSTORE_BASE64: ${{ needs.plan.outputs.publish == 'true' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ needs.plan.outputs.publish == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ needs.plan.outputs.publish == 'true' && secrets.ANDROID_KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ needs.plan.outputs.publish == 'true' && secrets.ANDROID_KEY_PASSWORD || '' }}
          RELEASE_CERTIFICATE: 20eb776de41ebb615df6592575eea48194fc9ceec4c8a33e6174cf26951c509b
        run: |
          keystore="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$keystore"' EXIT
          if [ "$PUBLISH" = "true" ]; then
            if [ -z "$KEYSTORE_BASE64" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is missing. See docs/RELEASE.md."
              exit 1
            fi
            echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          else
            export KEYSTORE_PASSWORD=trial-only KEY_PASSWORD=trial-only KEY_ALIAS=trial
            keytool -genkeypair -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD \
              -keypass:env KEY_PASSWORD -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 \
              -validity 1 -dname "CN=ulEditor trial run"
          fi

          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          mkdir -p signed

          # Aligned before it is signed, as apksigner requires; 16 KB pages for
          # the native libraries where this zipalign knows them, 4 KB where not.
          "$tools/zipalign" -P 16 -f 4 dist-android/unsigned.apk "$RUNNER_TEMP/aligned.apk" ||
            "$tools/zipalign" -p -f 4 dist-android/unsigned.apk "$RUNNER_TEMP/aligned.apk"

          apk="signed/ulEditor_${version}_android.apk"
          # No v4 signature: it is a file of its own (.idsig), for installing
          # over adb while the APK is still copying, and has no place beside it
          # on a release page.
          "$tools/apksigner" sign --ks "$keystore" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --v4-signing-enabled false \
            --out "$apk" "$RUNNER_TEMP/aligned.apk"
          # Every signer apksigner reports, however it names them — older
          # build-tools say "Signer #1", newer "V3.0 Signer" — and they must
          # all be one certificate. Nothing found is a failure in a trial too:
          # a check that reads nothing would pass every release it should stop.
          signed_with=$("$tools/apksigner" verify --print-certs "$apk" |
            sed -n 's/^.*[Ss]igner.* certificate SHA-256 digest: *//p' | sort -u)
          echo "signed with certificate: $signed_with"
          if [ -z "$signed_with" ] || [ "$(printf '%s\n' "$signed_with" | wc -l)" -ne 1 ]; then
            echo "::error::Could not read one certificate from apksigner: '$signed_with'."
            exit 1
          fi
          if [ "$PUBLISH" = "true" ] && [ "$signed_with" != "$RELEASE_CERTIFICATE" ]; then
            echo "::error::The APK is signed with certificate $signed_with, and every installed copy has $RELEASE_CERTIFICATE. No phone would take it as an update. The keystore in Secrets is not the release key — see docs/RELEASE.md."
            exit 1
          fi

          if [ -f dist-android/unsigned.aab ]; then
            aab="signed/ulEditor_${version}_android.aab"
            cp dist-android/unsigned.aab "$aab"
            jarsigner -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD \
              -keypass:env KEY_PASSWORD "$aab" "$KEY_ALIAS"
            jarsigner -verify "$aab"
          fi
          ls -l signed
        shell: bash

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-signed
          path: signed/
          if-no-files-found: error
          # A week, not a day: the signers wait for a person to approve them
          # in the `release` environment, and on 2026-10-09 an approval given
          # two and a half days after the build found every build gone.
          retention-days: 7
          overwrite: true

  android-publish:
    name: Publish Android
    needs: [plan, create-release, android-sign]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-signed
          path: signed
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: gh release upload "$TAG" signed/* --clobber --repo "$GITHUB_REPOSITORY"
        shell: bash
