name: Release

# Instaleri se grade u CI-u, ne na razvojnom stroju.
#
# Razlog je konkretan: Windows Smart App Control blokira nepotpisane
# build-script binarije koje cargo generira u release profilu, pa
# `tauri build` na stroju sa SAC-om u enforcement načinu pada s
# „An Application Control policy has blocked this file (os error 4551)".
# GitHub runneri nemaju SAC, a usput dobivamo i sve tri platforme odjednom.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (MSI + NSIS)
            args: ''
          - os: macos-latest
            label: macOS (Apple Silicon)
            args: '--target aarch64-apple-darwin'
          - os: macos-latest
            label: macOS (Intel)
            args: '--target x86_64-apple-darwin'
          - os: ubuntu-latest
            label: Linux (deb + AppImage)
            args: ''

    steps:
      - uses: actions/checkout@v4

      - name: Sistemske ovisnosti (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'ulEditor ${{ github.ref_name }}'
          releaseDraft: true
          args: ${{ matrix.args }}
