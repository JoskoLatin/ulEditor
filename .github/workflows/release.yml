name: Release

# Installers are built in CI, not on a development machine.
#
# The reason is concrete: Windows Smart App Control blocks the unsigned
# build-script binaries cargo generates in the release profile, so `tauri build`
# on a machine with SAC in enforcement mode fails with "An Application Control
# policy has blocked this file (os error 4551)". GitHub runners have no SAC, and
# we get all three platforms at once as a bonus.
#
# One tag gives one release with everything inside — desktop installers and the
# phone APK. That is why `create-release` goes first and opens the draft itself:
# were a build to open it, five parallel jobs would race to create it and we
# would end up with five half-filled releases.

on:
  push:
    tags: ['v*']
  # A single builder can fail on something the code has nothing to do with — a
  # broken NDK download, a runner that loses the network. Rebuilding all five
  # for it costs half an hour and republishes installers that were already
  # correct, so one platform can be built into the release that already exists.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, and it must already exist (v0.1.0)'
        required: true
      platforms:
        description: 'Which builders to run'
        required: true
        default: all
        type: choice
        options: [all, desktop, android]

permissions:
  contents: write

jobs:
  create-release:
    name: Open the release draft
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.result }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # A release without a tag makes no sense: name, version and links all hang off it.
      - name: Determine the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="$INPUT_TAG"
          fi
          if [[ -z "$tag" ]]; then
            echo "::error::Releases are built from a tag only. Run: git tag v0.1.0 && git push origin v0.1.0"
            exit 1
          fi
          # Checked here rather than left to the builders: a typo in the input
          # would otherwise surface twenty minutes later, as a checkout failure
          # in four jobs at once.
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::There is no tag $tag in this repository."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Draft
        id: draft
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const tag = '${{ steps.tag.outputs.tag }}';
            const { owner, repo } = context.repo;
            // Looked for before it is created, because a release for this tag
            // may already be open — a rebuild of one platform is the ordinary
            // case. `getReleaseByTag` is no use here: it returns published
            // releases only, and ours stays a draft until the installers are
            // in it, so the list is searched instead.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100,
            });
            const existing = releases.find((r) => r.tag_name === tag);
            if (existing) {
              core.info(`Attaching to the release already open for ${tag} (${existing.id})`);
              return String(existing.id);
            }
            const { data } = await github.rest.repos.createRelease({
              owner, repo,
              tag_name: tag,
              name: `ulEditor ${tag}`,
              draft: true,
              generate_release_notes: true,
            });
            return String(data.id);

  desktop:
    name: ${{ matrix.label }}
    needs: create-release
    if: inputs.platforms != 'android'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (MSI + NSIS)
            args: ''
          - os: macos-latest
            label: macOS (Apple Silicon)
            args: '--target aarch64-apple-darwin'
          - os: macos-latest
            label: macOS (Intel)
            args: '--target x86_64-apple-darwin'
          - os: ubuntu-latest
            label: Linux (deb + AppImage)
            args: ''

    steps:
      # The tag, not the branch the run was started from: a rebuild has to
      # produce the same binary as the release it is joining. On a tag push
      # these are the same commit anyway.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: System dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            librsvg2-dev patchelf libxdo-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  android:
    name: Android (APK + AAB)
    needs: create-release
    if: inputs.platforms != 'desktop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          # Not cached. The cache round-trip restores the NDK incomplete — the
          # per-API wrapper scripts survive but `bin/clang` itself does not, so
          # the linker fails with exit 127 and a "No such file or directory"
          # buried four lines into a shell script. Re-downloading costs a
          # minute; debugging that costs an afternoon.
          local-cache: false

      # Two architectures cover practically every Android device in the wild.
      # i686 and x86_64 exist only on emulators, and each extra one doubles the
      # duration of the Rust build.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The key never touches the repository. Here it is written out of Secrets
      # onto the runner's disk, which is wiped as soon as the job ends.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is missing. See docs/RELEASE.md."
            exit 1
          fi
          cd apps/desktop/src-tauri/gen/android
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          cat > keystore.properties <<EOF
          storeFile=$(pwd)/keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
        shell: bash

      - name: Build APK and AAB
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: pnpm --filter @uleditor/desktop exec tauri android build --apk --aab --target aarch64 armv7

      # Gradle names the output after the module (`app-universal-release.apk`),
      # which on the release page, next to `ulEditor_0.1.0_x64.msi`, looks like
      # somebody else's file. It is renamed to match the desktop installers.
      - name: Rename and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          out=apps/desktop/src-tauri/gen/android/app/build/outputs
          mkdir -p dist-android

          apk=$(find "$out/apk" -name '*-release.apk' 2>/dev/null | head -1)
          aab=$(find "$out/bundle" -name '*-release.aab' 2>/dev/null | head -1)

          if [ -z "$apk" ]; then
            echo "::error::No APK was produced — check the output of the step above."
            exit 1
          fi

          cp "$apk" "dist-android/ulEditor_${version}_android.apk"
          if [ -n "$aab" ]; then
            cp "$aab" "dist-android/ulEditor_${version}_android.aab"
          fi

          gh release upload "$TAG" dist-android/* --clobber
        shell: bash
