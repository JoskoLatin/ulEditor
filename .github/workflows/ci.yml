name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter @uleditor/shell-ui build

      # Annotations are checked without a browser: the written PDF is parsed
      # again and inspected for real annotation objects.
      - run: pnpm verify:pdf

      # The runtime check is driven by a real browser — static analysis does
      # not catch an editor that fails to mount.
      - run: pnpm exec playwright install --with-deps chromium
      - name: Runtime check of the shell
        run: |
          pnpm --filter @uleditor/shell-ui preview --port 5273 &
          # Without waiting this is a race macOS tends to lose: the check starts
          # while the server is still coming up and gets ERR_CONNECTION_REFUSED.
          for _ in $(seq 1 60); do
            curl -sf http://localhost:5273 >/dev/null && break
            sleep 1
          done
          node tools/verify-ui.mjs --url http://localhost:5273
        shell: bash

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: tools/screenshots/
          retention-days: 7

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            librsvg2-dev patchelf libxdo-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # Frontend dist mora postojati prije `generate_context!`.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @uleditor/shell-ui build

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  licenses:
    name: Licence check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      # A copyleft dependency sneaking into the core would change the licence of
      # the whole project. That is why this step blocks rather than warns.
      - run: cargo deny check licenses bans sources

  android:
    name: Android check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          local-cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2

      # `generate_context!` reads the frontend dist, so it must exist here too.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @uleditor/shell-ui build

      # A mobile build breaks differently from a desktop one — a missing JNI
      # symbol, a dependency without an android target, a wrong minSdk. Without
      # this check we would find out on release day, when it costs the most.
      - name: Does the core compile for a phone
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo check -p uleditor-desktop --target aarch64-linux-android

  wasm:
    name: WASM build of the core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Proof the same core also goes into a browser — phase 3 depends on it.
      - run: cargo build -p ul-formats --target wasm32-unknown-unknown --release
