name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter @uleditor/shell-ui build

      # Anotacije se provjeravaju bez preglednika: zapisani PDF se ponovno
      # parsira i gleda sadrži li prave anotacijske objekte.
      - run: pnpm verify:pdf

      # Runtime provjera se vozi pravim preglednikom — statička analiza ne
      # hvata editor koji se ne montira.
      - run: pnpm exec playwright install --with-deps chromium
      - name: Runtime provjera shella
        run: |
          pnpm --filter @uleditor/shell-ui preview --port 5273 &
          node tools/verify-ui.mjs --url http://localhost:5273
        shell: bash

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: tools/screenshots/
          retention-days: 7

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Sistemske ovisnosti (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # Frontend dist mora postojati prije `generate_context!`.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @uleditor/shell-ui build

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  licenses:
    name: Provjera licenci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      # Copyleft ovisnost koja se ušulja u core promijenila bi licencu cijelog
      # projekta. Zato je ovo blokirajući korak, ne upozorenje.
      - run: cargo deny check licenses bans sources

  android:
    name: Android provjera
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          local-cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2

      # `generate_context!` čita frontend dist, pa mora postojati i ovdje.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @uleditor/shell-ui build

      # Mobilni build puca drukčije od desktopa — nedostajući JNI simbol,
      # ovisnost bez android targeta, kriva minSdk. Bez ove provjere to
      # otkrivamo tek na dan izdanja, kad je najskuplje.
      - name: Prevodi li se jezgra za telefon
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo check -p uleditor-desktop --target aarch64-linux-android

  wasm:
    name: WASM build jezgre
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Dokaz da ista jezgra ide i u preglednik — faza 3 ovisi o tome.
      - run: cargo build -p ul-formats --target wasm32-unknown-unknown --release
