name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck

      # A missing translation renders as English and fails nothing — the key is
      # the English source text. So without this step the Croatian catalogue
      # falls behind silently, and a renamed placeholder reaches the user as
      # literal braces.
      - run: pnpm verify:i18n

      - run: pnpm --filter @uleditor/shell-ui build

      # Annotations are checked without a browser: the written PDF is parsed
      # again and inspected for real annotation objects.
      - run: pnpm verify:pdf

      # The runtime check is driven by a real browser — static analysis does
      # not catch an editor that fails to mount.
      - run: pnpm exec playwright install --with-deps chromium
      - name: Runtime check of the shell
        run: |
          pnpm --filter @uleditor/shell-ui preview --port 5273 &
          # Without waiting this is a race macOS tends to lose: the check starts
          # while the server is still coming up and gets ERR_CONNECTION_REFUSED.
          for _ in $(seq 1 60); do
            curl -sf http://localhost:5273 >/dev/null && break
            sleep 1
          done
          node tools/verify-ui.mjs --url http://localhost:5273
        shell: bash

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: tools/screenshots/
          retention-days: 7

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: System dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            librsvg2-dev patchelf libxdo-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # The frontend dist has to exist before `generate_context!`.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @uleditor/shell-ui build

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  licenses:
    name: Licence check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Pinned. The unpinned form installs whatever cargo-deny released most
      # recently, so a change in its config schema turns this job red with no
      # commit of ours behind it — which is how 0.20 broke it: the meaning of
      # `allow-wildcard-paths` narrowed to crates marked `publish = false`.
      # A licence gate that fails for reasons unrelated to licences is a gate
      # people learn to ignore.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      # A copyleft dependency sneaking into the core would change the licence of
      # the whole project. That is why this step blocks rather than warns.
      - run: cargo deny check licenses bans sources

  android:
    name: Android check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          # Not cached. The cache round-trip restores the NDK incomplete — the
          # per-API wrapper scripts survive but `bin/clang` itself does not, so
          # the linker fails with exit 127 and a "No such file or directory"
          # buried four lines into a shell script. Re-downloading costs a
          # minute; debugging that costs an afternoon.
          local-cache: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2

      # `generate_context!` reads the frontend dist, so it must exist here too.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @uleditor/shell-ui build

      # A mobile build breaks differently from a desktop one — a missing JNI
      # symbol, a dependency without an android target, a wrong minSdk. Without
      # this check we would find out on release day, when it costs the most.
      #
      # `build`, not `check`: check stops before linking, and the first Android
      # release failed in exactly the step check skips — a broken NDK whose
      # `bin/clang` was missing. A check that cannot fail the way the release
      # fails is not covering the release.
      - name: Does the core build for a phone
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo build -p uleditor-desktop --target aarch64-linux-android --lib

  wasm:
    name: WASM build of the core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Proof the same core also goes into a browser — phase 3 depends on it.
      - run: cargo build -p ul-formats --target wasm32-unknown-unknown --release
