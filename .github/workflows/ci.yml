name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck

      # A missing translation renders as English and fails nothing — the key is
      # the English source text. So without this step the Croatian catalogue
      # falls behind silently, and a renamed placeholder reaches the user as
      # literal braces.
      - run: pnpm verify:i18n

      # The version lives in tauri.conf.json and is mirrored into three
      # manifests that npm and cargo each insist on having their own copy of. A
      # mirror that has drifted breaks nothing at the time and produces an
      # installer named one version that reports another.
      - run: pnpm verify:version

      # A language the detector can name and the editor cannot colour opens as
      # grey text, with nothing raised anywhere. Seven were in that state before
      # this existed.
      - run: pnpm verify:languages

      # The recent-files list is desktop-only, so the browser checks below never
      # reach it. This drives the module directly.
      - run: pnpm verify:recent

      # The tree's ordering is a pure function over nodes, and the cases worth
      # pinning are ones a screenshot would never show — a Croatian name in the
      # right place, slika2 before slika10, an entry with no date going last.
      - run: pnpm verify:tree

      # The menu draws rows out of a list of command ids, and an id that no
      # longer exists is not an error — it is one row fewer, which is how a
      # deliberate absence and a typo come to look exactly alike.
      - run: pnpm verify:menu

      # A self-updating program has a long list of ways to fail in silence: a
      # public key that no longer matches the private one, a permission never
      # granted, a manifest naming an artefact nobody builds. Every one of them
      # ends the same way — no update ever arrives, and nothing is logged
      # anywhere. So the pieces are compared against each other, including the
      # rule that the page's own sandbox is not widened for a request Rust makes.
      - run: pnpm verify:updates

      # A format is declared twice — once by its editor, once by the shell that
      # registers it before the editor's code is fetched — and the second copy
      # is the one that decides whether a document can be saved at all. This is
      # what keeps the two from drifting: `.odt` became editable in the reader
      # and stayed read-only in the shell, so the program offered the text and
      # then refused to write it.
      - run: pnpm verify:providers

      # Office editing is byte surgery, and the central claim is what did NOT
      # change: every part of the archive outside the touched ranges, byte for
      # byte. The browser check below proves the seam to the page; these prove
      # the bytes.
      - run: pnpm verify:docx
      - run: pnpm verify:xlsx

      # OpenDocument text, where the same surgery meets a format that keeps its
      # spacing in elements: two spaces typed after a full stop have to come
      # back out as two, and a piece emptied of its text has to keep its place
      # so the next save does not land in the wrong sentence.
      - run: pnpm verify:odt

      # And the two OpenDocument routines the page cannot see into. A date is
      # written `2026-06-15` there and as a count of days in a converted `.xlsx`
      # — one out and the invoice is simply dated yesterday, with nothing
      # looking broken; a formula is turned into something readable by
      # substitution over somebody else's string.
      - run: pnpm verify:odf

      # The old binary Word: a file assembled byte by byte and read back — the
      # piece table, the property pages keyed by byte position, the table
      # punctuation. The pair of encodings is the part that matters here, since
      # `č` does not exist in CP1252 and Word therefore writes a Croatian
      # document narrow and wide in turn, in the one file.
      - run: pnpm verify:doc

      # The old binary Excel: a hand-built compound file read back, including
      # the shared string a CONTINUE record cuts in half.
      - run: pnpm verify:xls

      # Rich Text, where the code page is claimed twice and the two disagree —
      # and where a picture, a signature and hidden text all have to be read
      # past without any of them reaching the page.
      - run: pnpm verify:rtf

      # The OCR worker, wasm core and language models are copied out of
      # node_modules and are not in the repository, so a plain `vite build`
      # leaves them out. Tesseract then reaches for a CDN, which the desktop CSP
      # blocks and a plane has no answer to either — so they are put in place
      # here, and the check below runs against the same files the installer
      # ships.
      - run: node tools/ocr-assets.mjs
      - run: pnpm --filter @uleditor/shell-ui build

      # Annotations are checked without a browser: the written PDF is parsed
      # again and inspected for real annotation objects.
      - run: pnpm verify:pdf

      # The same standard applied to the export: the saved file is opened again
      # and the text taken back out of it, which is where the difference between
      # "some bytes were written" and "Word and Acrobat can open this" shows.
      - run: pnpm verify:export

      # The runtime check is driven by a real browser — static analysis does
      # not catch an editor that fails to mount.
      - run: pnpm exec playwright install --with-deps chromium
      - name: Runtime check of the shell
        run: |
          pnpm --filter @uleditor/shell-ui preview --port 5273 &
          # Without waiting this is a race macOS tends to lose: the check starts
          # while the server is still coming up and gets ERR_CONNECTION_REFUSED.
          for _ in $(seq 1 60); do
            curl -sf http://localhost:5273 >/dev/null && break
            sleep 1
          done
          node tools/verify-ui.mjs --url http://localhost:5273
          # The vector and 3D viewers, against the same server. Kept separate
          # from the check above because they fail for their own reasons — a
          # WebGL context that will not start on a runner is worth telling apart
          # from an editor that will not mount.
          node tools/verify-viewers.mjs --url http://localhost:5273
          # Diagrams in Markdown, where the claim worth checking is as much about
          # what is not fetched: mermaid is two thirds of a megabyte gzipped, and
          # a document without a fence must not pay for it. The network is
          # watched for that, so this cannot be checked without a browser either.
          node tools/verify-mermaid.mjs --url http://localhost:5273
          # OCR cannot be faked: an image is drawn with known text in it, put
          # through recognition, and the text has to come back. It runs on one
          # runner rather than three because nothing in it is platform-specific
          # — the same wasm, the same model, the same Chromium — while it costs
          # a minute of recognition each time.
          if [ "$RUNNER_OS" = "Linux" ]; then
            node tools/verify-ocr.mjs --url http://localhost:5273
          fi
        shell: bash

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: tools/screenshots/
          retention-days: 7

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: System dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            librsvg2-dev patchelf libxdo-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # The frontend dist has to exist before `generate_context!`.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @uleditor/shell-ui build

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  licenses:
    name: Licence check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Pinned. The unpinned form installs whatever cargo-deny released most
      # recently, so a change in its config schema turns this job red with no
      # commit of ours behind it — which is how 0.20 broke it: the meaning of
      # `allow-wildcard-paths` narrowed to crates marked `publish = false`.
      # A licence gate that fails for reasons unrelated to licences is a gate
      # people learn to ignore.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      # A copyleft dependency sneaking into the core would change the licence of
      # the whole project. That is why this step blocks rather than warns.
      - run: cargo deny check licenses bans sources

  android:
    name: Android check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          # Not cached. The cache round-trip restores the NDK incomplete — the
          # per-API wrapper scripts survive but `bin/clang` itself does not, so
          # the linker fails with exit 127 and a "No such file or directory"
          # buried four lines into a shell script. Re-downloading costs a
          # minute; debugging that costs an afternoon.
          local-cache: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2

      # `generate_context!` reads the frontend dist, so it must exist here too.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @uleditor/shell-ui build

      # A mobile build breaks differently from a desktop one — a missing JNI
      # symbol, a dependency without an android target, a wrong minSdk. Without
      # this check we would find out on release day, when it costs the most.
      #
      # `build`, not `check`: check stops before linking, and the first Android
      # release failed in exactly the step check skips — a broken NDK whose
      # `bin/clang` was missing. A check that cannot fail the way the release
      # fails is not covering the release.
      - name: Does the core build for a phone
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          # `--target` tells rustc what to compile for and nothing more: the
          # linker stays the host's `cc`, which reads the ARM64 objects and says
          # "file in wrong format". `tauri android build` configures this
          # itself, which is why the release never needed the line and a bare
          # cargo build does. 24 is the minSdk in build.gradle.kts — the NDK
          # ships one wrapper per API level and they are not interchangeable.
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: cargo build -p uleditor-desktop --target aarch64-linux-android --lib

  wasm:
    name: WASM build of the core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Proof the same core also goes into a browser — phase 3 depends on it.
      - run: cargo build -p ul-formats --target wasm32-unknown-unknown --release
      # And the image transforms with it. They are only reachable through a Tauri
      # command today, so nothing would notice a dependency that cannot be built
      # for the web — until phase 3, when it would be a rewrite rather than a
      # fix. `image` was chosen with its features cut down for this reason.
      - run: cargo build -p ul-image --target wasm32-unknown-unknown --release
