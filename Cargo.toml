[workspace]
resolver = "2"
members = ["crates/ul-formats", "crates/ul-core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.3.2"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.82"
repository = "https://github.com/JoskoLatin/ulEditor"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
